{% extends "myapp/base.html" %}
{% block body %}
    <ul>
        {% for item in item_list %}
            <li>
                {% comment %} Using dynamic url instead of hard coding it.
                (namespace:urlname) {% endcomment %}
                <a href=" {% url 'myapp:detail' item.id %} ">{{ item.item_name }} - {{ item.item_price }} - {{
                item.item_desc }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock body %}
