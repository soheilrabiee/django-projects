{% extends "myapp/base.html" %}
{% block body %}
    <div class="flex flex-col justify-center items-center min-h-screen p-10">
        <h1>Login</h1>
        <form method="post" class="shadow-lg p-10 space-y-10">
            {% csrf_token %}
            <div>
                <label for="">Username</label>
                {% comment %} form.username only puts the input field of the form {% endcomment %}
                <div class="border rounded p-2">{{ form.username }}</div>
            </div>
            <div>
                <label for="">Password</label>
                <div class="border rounded p-2">{{ form.password }}</div>
            </div>
            <button type="submit" class="bg-blue-500 px-2 py-2 w-full text-white">Login</button>
        </form>
    </div>
{% endblock body %}
